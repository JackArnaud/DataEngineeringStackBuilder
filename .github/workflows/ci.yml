name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Plain npm scripts only: the build must stay runnable anywhere, so moving off
      # GitHub Pages later means changing a deploy step, not the build.
      - run: npm run ci
